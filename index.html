<!DOCTYPE html>
<html lang="ru" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Экран с цифрами</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Responsive extra-large text centered perfectly */
        .number-text {
            font-size: min(40vw, 35vh);
            line-height: 1;
            font-weight: 900;
            color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* High-contrast vivid backgrounds */
        .bg-yellow-active {
            background-color: #FFDE00;
        }

        .bg-red-active {
            background-color: #E60000;
        }

        /* Анимация обновления чисел при клике */
        .number-pop {
            animation: pop 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body id="app-body" class="bg-yellow-active cursor-pointer">
    <main class="w-full h-full flex flex-col">
        <!-- Top Half -->
        <section class="w-full h-1/2 flex items-center justify-center border-b border-black/10">
            <span id="top-num" class="number-text"></span>
        </section>

        <!-- Bottom Half -->
        <section class="w-full h-1/2 flex items-center justify-center">
            <span id="bottom-num" class="number-text"></span>
        </section>
    </main>

    <script>
        // State tracker for background color (true = Yellow, false = Red)
        let isYellow = true;

        const bodyElement = document.getElementById('app-body');
        const topNumElement = document.getElementById('top-num');
        const bottomNumElement = document.getElementById('bottom-num');

        // Function to update screen state with independent random numbers
        function updateScreen() {
            // Независимая генерация случайного числа (1-6) для каждой половины
            const topValue = Math.floor(Math.random() * 6) + 1;
            const bottomValue = Math.floor(Math.random() * 6) + 1;

            topNumElement.textContent = topValue;
            bottomNumElement.textContent = bottomValue;

            // Визуальный отклик при клике (анимация)
            topNumElement.classList.remove('number-pop');
            bottomNumElement.classList.remove('number-pop');
            void topNumElement.offsetWidth; // Перерисовать элемент
            topNumElement.classList.add('number-pop');
            bottomNumElement.classList.add('number-pop');

            if (isYellow) {
                bodyElement.classList.remove('bg-red-active');
                bodyElement.classList.add('bg-yellow-active');
            } else {
                bodyElement.classList.remove('bg-yellow-active');
                bodyElement.classList.add('bg-red-active');
            }
        }

        // Click handler to switch background state and update numbers
        function handleClick() {
            isYellow = !isYellow;
            updateScreen();
        }

        // Listen for clicks anywhere on screen
        document.addEventListener('click', handleClick);

        // Run immediately on page load
        window.onload = function() {
            updateScreen();
        };
    </script>
</body>
</html>
